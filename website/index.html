  .activity-gallery-copy {

  .fund-section-docs {

  }
  @media (min-width: 769px) {
    .fund-section-docs {
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr) !important;
      align-items: stretch;
    }
    .fund-section-docs-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;

  }
  .fund-section-docs-actions {
    display: flex;

  .fund-section-commitment {
    padding: 16px 20px;
    background: rgba(255, 255, 255, 0.65);

  }
  .social-impact-quotes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;

    margin-top: 56px;

    margin-left: auto;
    margin-right: auto;
  }
  @media (max-width: 768px) {
    .fund-section-docs { text-align: center; }
    .fund-section-docs-actions { justify-content: center; }
    .fund-section-commitment { text-align: left; }
    .social-impact-quotes { grid-template-columns: 1fr !important; }
  }
  .recap-days-grid {
    display: grid !important;
    gap: 20px;
  }
  @media (max-width: 992px) {
    .recap-days-grid {
      display: flex !important;
      overflow-x: auto !important;
      padding-bottom: 12px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      gap: 16px;
    }
    .recap-days-grid::-webkit-scrollbar {
      display: none;

    .recap-days-grid > div {
      flex: 0 0 280px !important;
      scroll-snap-align: start;

  .eb-group-title {
    font-family: var(--font-display);

    letter-spacing: 0.04em;

    color: var(--purple-800);
    margin: 36px auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: fit-content;
    padding: 10px 26px;
    border: 1.5px solid var(--purple-200);
    border-radius: 999px;
    background: var(--surface-card);

  }
  .eb-group-title:first-of-type {
    margin-top: 8px;

  .eb-grid-3 {
    display: grid !important;

  .eb-grid-2 {
    display: grid !important;
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 24px;
    max-width: 600px;
    margin: 0 auto 48px;
  }
  .eb-grid-4 {
    display: grid !important;
    grid-template-columns: repeat(4, 1fr) !important;
    gap: 24px;
    margin-bottom: 48px;
  }
  @media (max-width: 992px) {
    .eb-grid-4 {
      grid-template-columns: repeat(2, 1fr) !important;
    }
  }
  @media (max-width: 768px) {
    .eb-grid-3, .eb-grid-2, .eb-grid-4 {
      grid-template-columns: 1fr !important;
      gap: 20px;
    }
  }
  .eb-card {
    background: var(--surface-card);
    border-radius: 16px;
    border: 1px solid var(--purple-100);
    padding: 24px;

    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;

  }
  .eb-card:hover {
    transform: translateY(-4px);
    border-color: var(--color-primary);
    box-shadow: var(--shadow-lg), 0 0 12px rgba(124, 58, 237, 0.15);
  }
  .eb-avatar-wrapper {

    margin-bottom: 16px;
    transition: all 0.3s ease;
    overflow: hidden;
  }
  .eb-card:hover .eb-avatar-wrapper {
    background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
    transform: scale(1.05);
  }
  .eb-avatar {
    width: 100%;

    object-fit: cover;

  }
  .eb-name {

</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react" src="Icons.jsx?v=3"></script>
<script type="text/babel" data-presets="react" src="Footer.jsx?v=4"></script>
<script type="text/babel" data-presets="react" src="Header.jsx?v=7"></script>
<script type="text/babel" data-presets="react" src="HomeScreen.jsx?v=17"></script>
<script type="text/babel" data-presets="react" src="DonorsScreen.jsx?v=5"></script>
<script type="text/babel" data-presets="react" src="DonateScreen.jsx?v=3"></script>
<script type="text/babel" data-presets="react" src="AboutUsScreen.jsx?v=7"></script>
<script type="text/babel" data-presets="react" src="ForwardCreateScreen.jsx?v=1"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

function pathToRoute() {
  const p = (window.location.pathname || '/').replace(/\/$/, '') || '/';
  if (p === '/aboutus') return 'aboutus';
  if (p === '/forward-create') return 'forwardCreate';
  return 'home';
}

function App() {
  const ns = window.BCDesignSystem_b342dd || {};
  if (!ns.Button) {
    return (
      <div style={{ height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 12, fontFamily: 'var(--font-body)', color: 'var(--text-muted)' }}>
        <img src="https://cdn.buoc.site/assets/logo-buoc.png" alt="Bước" style={{ height: 56, opacity: 0.9 }} />
        <div>Đang tải thư viện thiết kế…</div>
      </div>
    );
  }
  
  const [route, setRoute] = useState(pathToRoute);
  const [donateOpen, setDonateOpen] = useState(false);
  const [campaign, setCampaign] = useState(null);

  useEffect(() => {
    const titles = {
      home: 'Bước · Gây quỹ trại hè kỹ năng',
      aboutus: 'Bước · Về chúng tôi',
      donors: 'Bước · Nhà hảo tâm',
      forwardCreate: 'Bước · Tạo link rút gọn',
    };
    document.title = titles[route] || titles.home;
  }, [route]);

  useEffect(() => {
    const onPop = () => setRoute(pathToRoute());
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  const loadData = () => {
    Promise.all([
      fetch('/api/stats').then(r => r.json()),
      fetch('/api/donations').then(r => r.json()),
      fetch('/api/config').then(r => r.json())
    ]).then(([stats, donations, config]) => {
      window.CAMPAIGN = {
        raised: stats.raised,
        goal: stats.goal,
        donors: stats.count,
        scholarships: Math.floor(stats.raised / 200000),
        daysLeft: stats.daysLeft || 0,
        recentDonors: donations.map(d => ({
          name: d.name,
          amount: d.amount,
          when: new Date(d.at).toLocaleDateString('vi-VN'),
          msg: ''
        })),
        config: config
      };
      setCampaign(window.CAMPAIGN);
    }).catch(e => console.error("Error loading data:", e));
  };

  useEffect(() => {
    loadData();
    // Tự động làm mới dữ liệu sau mỗi 10 giây
    const interval = setInterval(loadData, 10000);
    return () => clearInterval(interval);
  }, []);

  const navigate = (r) => {
    const paths = { home: '/', aboutus: '/aboutus', donors: '/', forwardCreate: '/forward-create' };
    const target = paths[r] || '/';
    if (window.location.pathname !== target) {
      window.history.pushState({}, '', target);
    }
    setRoute(r === 'aboutus' ? 'aboutus' : r === 'forwardCreate' ? 'forwardCreate' : r === 'donors' ? 'donors' : 'home');
    const el = document.getElementById('kit-scroll');
    if (el) el.scrollTo({ top: 0 });
  };
  
  const transparent = route === 'home';
  const headerActive = route === 'aboutus' ? 'aboutus' : route === 'donors' ? 'donors' : 'home';

  if (!campaign) {
    return (
      <div style={{ height: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 16, fontFamily: 'var(--font-body)', color: 'var(--text-muted)' }}>
        <img src="https://cdn.buoc.site/assets/logo-buoc.png" alt="Bước Logo" style={{ height: 48, width: 'auto', opacity: 0.9 }} />
        <div>Đang tải dữ liệu...</div>
      </div>
    );
  }

  return (
    <div id="kit-scroll">
      <Header onNavigate={navigate} onDonate={() => setDonateOpen(true)} transparent={transparent} active={headerActive} />
      {route === 'aboutus'
        ? <AboutUsScreen onDonate={() => setDonateOpen(true)} onNavigate={navigate} />
        : route === 'forwardCreate'
        ? <ForwardCreateScreen onNavigate={navigate} />
        : route === 'home'
        ? <HomeScreen onDonate={() => setDonateOpen(true)} onNavigate={navigate} />
        : <DonorsScreen onDonate={() => setDonateOpen(true)} onNavigate={navigate} />}
      <DonateScreen open={donateOpen} onClose={() => setDonateOpen(false)} config={campaign.config} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
