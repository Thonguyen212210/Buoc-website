const { useState } = React;
function App() {
  const ns = window.BCDesignSystem_b342dd || {};

  const navigate = (r) => {
    const target = (r === 'donors') ? 'donors' : 'home';
    setRoute(target);
    const el = document.getElementById('kit-scroll');
    if (el) el.scrollTo({ top: 0 });
  };
  const transparent = route === 'home';
  return (
    <div id="kit-scroll">
      <Header onNavigate={navigate} onDonate={() => setDonateOpen(true)} transparent={transparent} active={route === 'donors' ? 'donors' : 'home'} />
      {route === 'home'
        ? <HomeScreen onDonate={() => setDonateOpen(true)} onNavigate={navigate} />
        : <DonorsScreen onDonate={() => setDonateOpen(true)} onNavigate={navigate} />}
      <DonateScreen open={donateOpen} onClose={() => setDonateOpen(false)} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
