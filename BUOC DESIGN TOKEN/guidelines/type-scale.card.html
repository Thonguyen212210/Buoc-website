<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
 body{margin:0;font-family:var(--font-body);background:var(--surface-card);padding:20px;color:var(--text-strong);}
 .r{display:flex;align-items:baseline;gap:16px;margin-bottom:6px;}
 .tok{font-size:11px;color:var(--text-muted);width:120px;flex:none;font-weight:600;}
 .d{font-family:var(--font-display);font-weight:700;line-height:1.1;}
</style></head><body>
 <div class="r"><span class="tok">--text-4xl 64</span><span class="d" style="font-size:var(--text-4xl)">Bước</span></div>
 <div class="r"><span class="tok">--text-2xl 36</span><span class="d" style="font-size:var(--text-2xl)">Trại hè kỹ năng sống</span></div>
 <div class="r"><span class="tok">--text-xl 28</span><span class="d" style="font-size:var(--text-xl)">Mục tiêu 5.000.000₫</span></div>
 <div class="r"><span class="tok">--text-md 18</span><span style="font-size:var(--text-md)">Lead — câu mở đầu thân thiện</span></div>
 <div class="r"><span class="tok">--text-base 16</span><span style="font-size:var(--text-base)">Body — nội dung chính của trang</span></div>
 <div class="r"><span class="tok">--text-sm 14</span><span style="font-size:var(--text-sm)">Caption · nhãn phụ</span></div>
 <div class="r"><span class="tok">--text-2xs 11</span><span style="font-size:var(--text-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)">Overline · eyebrow</span></div>
</body></html>
