<!-- @dsCard group="Colors" viewport="700x150" name="Butter cream / gold scale" subtitle="Warm accent — secondary --cream-300" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
 body{margin:0;font-family:var(--font-body);background:var(--surface-card);padding:18px;}
 .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);}
 .sw{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;}
 .sw span{font-size:10px;font-weight:700;color:#5a3d10;}
 .name{font-size:12px;color:var(--text-muted);margin-top:10px;}
</style></head><body>
<div class="row">
 <div class="sw" style="background:var(--cream-700)"><span style="color:#fff">700</span></div>
 <div class="sw" style="background:var(--cream-600)"><span>600</span></div>
 <div class="sw" style="background:var(--cream-500)"><span>500</span></div>
 <div class="sw" style="background:var(--cream-400)"><span>400</span></div>
 <div class="sw" style="background:var(--cream-300)"><span>300★</span></div>
 <div class="sw" style="background:var(--cream-200)"><span>200</span></div>
 <div class="sw" style="background:var(--cream-100)"><span>100</span></div>
</div>
<div class="name">★ <b>--cream-300 #FFF0A8</b> is the secondary accent (logo highlights, the gold CTA). Use <b>--cream-700</b> for cream text on light surfaces.</div>
</body></html>
