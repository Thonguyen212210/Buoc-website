<!-- @dsCard group="Colors" viewport="700x150" name="Brand purple scale" subtitle="Deep royal violet — primary --purple-700" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
 body{margin:0;font-family:var(--font-body);background:var(--surface-card);padding:18px;}
 .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);}
 .sw{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;}
 .sw span{font-size:10px;font-weight:600;}
 .name{font-size:12px;color:var(--text-muted);margin-top:10px;}
</style></head><body>
<div class="row">
 <div class="sw" style="background:var(--purple-950)"><span style="color:#fff">950</span></div>
 <div class="sw" style="background:var(--purple-900)"><span style="color:#fff">900</span></div>
 <div class="sw" style="background:var(--purple-800)"><span style="color:#fff">800</span></div>
 <div class="sw" style="background:var(--purple-700)"><span style="color:#fff">700★</span></div>
 <div class="sw" style="background:var(--purple-500)"><span style="color:#fff">500</span></div>
 <div class="sw" style="background:var(--purple-400)"><span style="color:#3D1A52">400</span></div>
 <div class="sw" style="background:var(--purple-300)"><span style="color:#3D1A52">300</span></div>
 <div class="sw" style="background:var(--purple-200)"><span style="color:#3D1A52">200</span></div>
 <div class="sw" style="background:var(--purple-100)"><span style="color:#3D1A52">100</span></div>
 <div class="sw" style="background:var(--purple-50)"><span style="color:#3D1A52">50</span></div>
</div>
<div class="name">★ <b>--purple-700 #603078</b> is the primary brand purple (the logo wordmark).</div>
</body></html>
