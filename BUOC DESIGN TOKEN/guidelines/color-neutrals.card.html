<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals — paper & ink" subtitle="Warm paper surfaces, plum-ink text" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
 body{margin:0;font-family:var(--font-body);background:var(--surface-card);padding:18px;}
 .grid{display:flex;gap:14px;}
 .col{flex:1;}
 .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);font-weight:700;margin-bottom:8px;}
 .row{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow-xs);border:1px solid var(--border-subtle);}
 .sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box;font-size:10px;font-weight:600;}
</style></head><body>
<div class="grid">
 <div class="col"><div class="lbl">Paper surfaces</div>
  <div class="row">
   <div class="sw" style="background:var(--paper-100);color:#6E5E78">100</div>
   <div class="sw" style="background:var(--paper-200);color:#6E5E78">200</div>
   <div class="sw" style="background:var(--paper-300);color:#6E5E78">300</div>
  </div></div>
 <div class="col"><div class="lbl">Ink text</div>
  <div class="row">
   <div class="sw" style="background:var(--ink-900);color:#fff">900</div>
   <div class="sw" style="background:var(--ink-700);color:#fff">700</div>
   <div class="sw" style="background:var(--ink-500);color:#fff">500</div>
   <div class="sw" style="background:var(--ink-300);color:#3D1A52">300</div>
   <div class="sw" style="background:var(--ink-100);color:#3D1A52">100</div>
  </div></div>
</div>
</body></html>
