<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-body); padding: 22px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; width: 100%; margin-bottom: 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Badge, Tag } = window.BCDesignSystem_b342dd;
const Ico = ({d}) => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>;
const heart = "M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.49 4.04 3 5.5l7 7Z";
const arrow = "M5 12h14M12 5l7 7-7 7";
function App(){
  return (
    <div>
      <div className="row"><span className="lbl">Buttons</span>
        <Button variant="accent" size="lg" iconRight={<Ico d={arrow}/>}>Quyên góp ngay</Button>
        <Button variant="primary">Tìm hiểu thêm</Button>
        <Button variant="secondary">Chia sẻ</Button>
        <Button variant="ghost">Bỏ qua</Button>
        <Button variant="primary" disabled>Đã đóng</Button>
      </div>
      <div className="row"><span className="lbl">Sizes &amp; icon buttons</span>
        <Button size="sm">Small</Button>
        <Button size="md">Medium</Button>
        <Button size="lg" iconLeft={<Ico d={heart}/>}>Large</Button>
        <IconButton variant="solid" label="like"><Ico d={heart}/></IconButton>
        <IconButton variant="soft" label="share"><Ico d={arrow}/></IconButton>
      </div>
      <div className="row"><span className="lbl">Badges</span>
        <Badge variant="success" dot>Đang gây quỹ</Badge>
        <Badge variant="accent">Giáo dục</Badge>
        <Badge variant="solid">Phase 1</Badge>
        <Badge variant="neutral">Tây Nguyên</Badge>
        <Badge variant="warning" dot>Sắp kết thúc</Badge>
      </div>
      <div className="row"><span className="lbl">Tags</span>
        <Tag active>Tất cả</Tag>
        <Tag>Tư duy phản biện</Tag>
        <Tag>Kỹ năng sống</Tag>
        <Tag removable>AI &amp; công nghệ</Tag>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
